name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: bash -n deploy-vps.sh show-setup.sh
      - run: python3 -m py_compile scripts/init-config.py
      - run: docker build -t arena-bridge:ci .
