# Usage: cp .env.example .env && edit it, then: docker compose up -d
# Point an A/AAAA record for $BRIDGE_HOST at this VPS (DNS-only / grey cloud if on Cloudflare,
# so Caddy can issue the certificate and long requests are not cut at 100s).
services:
  bridge:
    build:
      context: .
      args:
        BASE: ${NODE_BASE:-node:22-bookworm}
    image: arena-bridge:latest
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?set BRIDGE_TOKEN in .env}
      BRIDGE_HOST: ${BRIDGE_HOST:?set BRIDGE_HOST in .env}
      TZ: ${TZ:-Asia/Shanghai}
      LOCAL_NAME: ${LOCAL_NAME:-vps}
      UNLOCK_PASSWORD_HASH: ${UNLOCK_PASSWORD_HASH:-}
      DEVICE_TOKENS_JSON: ${DEVICE_TOKENS_JSON:?set device tokens in .env}
      DISABLE_POLICY: ${DISABLE_POLICY:-}
      # Behind Cloudflare proxy (orange cloud) requests are cut at 100s -> keep single calls under that.
      DEFAULT_TIMEOUT_SEC: ${DEFAULT_TIMEOUT_SEC:-90}
      MAX_TIMEOUT_SEC: ${MAX_TIMEOUT_SEC:-95}
      # Audit log for state-changing calls; default <HOME>/audit.log on the /data volume, "off" to disable.
      AUDIT_LOG: ${AUDIT_LOG:-}
    volumes:
      - workspace:/data          # agent's home / working files (persistent)
      - ./policy.json:/app/policy.json:ro
    # Uncomment to let the agent control the VPS's Docker (powerful, dangerous):
    #   - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    # Default: bind to localhost only; put your own nginx/Caddy/cloudflared in front (see nginx/ dir).
    # To use the bundled Caddy instead:  docker compose --profile caddy up -d
    ports: ["127.0.0.1:${BRIDGE_PORT:-3777}:3777"]

  caddy:
    profiles: ["caddy"]
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BRIDGE_HOST: ${BRIDGE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [bridge]

volumes:
  workspace:
  caddy_data:
  caddy_config:
